# The Verdalis suite for macOS: every plugin as CLAP, VST3 and Audio Unit,
# universal (Apple Silicon and Intel), macOS 10.15 or later.
#
# Built here because it cannot be built on the development machine: the macOS
# SDK may only be used on Apple hardware, and GitHub's macOS runners are that
# hardware. The bundles are signed ad hoc, not notarized; INSTALL.txt in the
# archive explains the one command that clears the quarantine.
#
# One job, every plugin in turn. It was a job per plugin first, but GitHub's
# arm64 runners are scarce enough that several of eleven jobs were regularly
# cancelled for want of one ("not acquired by Runner of type hosted even after
# multiple attempts"), and the suite archive needs all eleven in one run. One
# runner for the whole build takes 20-25 minutes and either runs or does not.
#
# The plugins are found the way release.sh finds them (every folder with a
# CMakeLists.txt but shared/), so a new plugin joins by existing. Each goes
# through shared/tools/macos-build-plugin.sh: build, self-test on arm64 and
# under Rosetta, sign ad hoc, auval. A failing plugin does not stop the others,
# so one run reports every failure; the job fails at the end if any did, and
# then packs nothing.
#
# A successful run uploads verdalis-suite-<version>-macos-universal.zip as a
# workflow artifact. When a GitHub release tagged v* is published
# (publish-release.sh), it is also attached to that release, beside the Linux
# and Windows archives.

name: macOS

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "_designs/**"
      - "**/docs/**"
      - "**/tools/analysis/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "_designs/**"
      - "**/docs/**"
      - "**/tools/analysis/**"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "10.15"

jobs:
  suite:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write # attaching the archive to a release
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: brew install meson ninja pkgconf

      # CLAP/ is gitignored (third-party SDKs, see CLAUDE.md): the versions the
      # Linux and Windows builds use, plus Apple's AudioUnitSDK, with the
      # patches from shared/patches/ applied.
      - name: SDKs
        run: |
          mkdir -p CLAP && cd CLAP
          git clone --depth 1 --branch 1.2.10 https://github.com/free-audio/clap.git
          git clone --depth 1 --branch v0.16.0 https://github.com/free-audio/clap-wrapper.git
          git clone --depth 1 --branch v3.8.1_build_84 https://github.com/steinbergmedia/vst3sdk.git
          git -C vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk
          git clone --depth 1 --branch AudioUnitSDK-1.1.0 https://github.com/apple/AudioUnitSDK.git
          for p in ../shared/patches/clap-wrapper-*.patch; do
            git -C clap-wrapper apply "../$p"
          done

      # Restored and saved in two steps, so a Cairo that was built is kept even
      # when a later step fails.
      - name: Cairo cache
        id: cairo
        uses: actions/cache/restore@v4
        with:
          path: |
            macbuild/cairo-macos/include
            macbuild/cairo-macos/lib
          key: cairo-macos-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('shared/cmake/build-macos-cairo.sh') }}

      - name: Cairo
        if: steps.cairo.outputs.cache-hit != 'true'
        run: shared/cmake/build-macos-cairo.sh macbuild/cairo-macos

      - name: Cairo cache save
        if: steps.cairo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            macbuild/cairo-macos/include
            macbuild/cairo-macos/lib
          key: ${{ steps.cairo.outputs.cache-primary-key }}

      - name: Plugins
        id: plugins
        run: |
          list=""
          for f in */CMakeLists.txt; do
            d="${f%/CMakeLists.txt}"
            [ "$d" = shared ] && continue
            grep -q '^project(' "$f" || continue
            list="${list:+$list }$d"
          done
          echo "list=$list" | tee -a "$GITHUB_OUTPUT"

      # Every plugin, each in its own log group. One failing does not stop the
      # rest; the summary says which, and the step fails if any did.
      - name: Build, test, sign and validate
        run: |
          failed=""
          echo "| Plugin | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for p in ${{ steps.plugins.outputs.list }}; do
            echo "::group::$p"
            start=$SECONDS
            if shared/tools/macos-build-plugin.sh "$p" "$RUNNER_TEMP/macos"; then
              result="ok"
            else
              result="FAILED"
              failed="$failed $p"
            fi
            echo "::endgroup::"
            echo "$p: $result ($((SECONDS - start)) s)"
            echo "| $p | $result |" >> "$GITHUB_STEP_SUMMARY"
            [ "$result" = ok ] || echo "::error title=$p::$p failed; see its log group"
          done
          if [ -n "$failed" ]; then
            echo "failed:$failed"
            exit 1
          fi

      - name: Package
        id: package
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            ver="${{ github.event.release.tag_name }}"
            ver="${ver#v}"
          else
            ver="dev-$(git rev-parse --short HEAD)"
          fi
          name="verdalis-suite-${ver}-macos-universal"
          d="dist/${name}"
          mkdir -p "$d"
          cp -R "$RUNNER_TEMP/macos" "$d/macos"

          cp README.md LICENSE "$d/"
          # A plugin whose licence differs from the suite's carries it beside
          # the suite's, exactly as release.sh does (SkyHowl's CC-BY credit).
          info=""
          for p in ${{ steps.plugins.outputs.list }}; do
            n="$(sed -n 's/^project(\([A-Za-z]*\) VERSION.*/\1/p' "$p/CMakeLists.txt")"
            v="$(sed -n 's/^project([A-Za-z]* VERSION \([0-9.]*\).*/\1/p' "$p/CMakeLists.txt")"
            info="${info}  ${n} ${v}"$'\n'
            if [ -f "$p/LICENSE" ] && ! cmp -s "$p/LICENSE" LICENSE; then
              cp "$p/LICENSE" "$d/LICENSE-${n}"
            fi
          done

          cat > "$d/BUILD-INFO.txt" <<EOF
          Verdalis suite ${ver} for macOS (universal: arm64 + x86_64, macOS 10.15 or later)

          Commit:       ${GITHUB_SHA}
          Built by:     GitHub Actions, ${{ github.workflow }} run ${{ github.run_id }}
          Formats:      CLAP, VST3, Audio Unit (v2)
          Signing:      ad hoc, not notarized
          SDKs:         clap 1.2.10, clap-wrapper v0.16.0 (patched, shared/patches),
                        VST3 SDK 3.8.1, AudioUnitSDK 1.1.0

          Plugins:
          ${info}
          EOF

          cat > "$d/INSTALL.txt" <<'EOF'
          Verdalis for macOS (10.15 or later, Apple Silicon and Intel)

          The macos/ folder holds every plugin in three formats. Install the
          format(s) your DAW uses:

            <Name>.clap       ->  ~/Library/Audio/Plug-Ins/CLAP/
            <Name>.vst3       ->  ~/Library/Audio/Plug-Ins/VST3/
            <Name>.component  ->  ~/Library/Audio/Plug-Ins/Components/

          (~/Library is hidden in the Finder: Go > Go to Folder... and type the path.)
          Logic Pro and GarageBand use the .component (Audio Unit).

          The plugins are free and not notarized by Apple, so macOS blocks
          files downloaded from the internet until their quarantine flag is
          cleared. After copying, open Terminal and run:

            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/CLAP
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components

          Without this the DAW does not load the plugins, or reports them as
          damaged. Then restart the DAW and let it rescan its plugins.

          The factory presets are built into every plugin. Your own presets
          live in ~/Library/Application Support/<Name>/presets.
          EOF

          ditto -c -k --keepParent "$d" "dist/${name}.zip"
          ls -l dist
          echo "zip=dist/${name}.zip" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.zip }}" --clobber
