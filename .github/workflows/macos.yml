# The Verdalis suite for macOS: every plugin as CLAP, VST3 and Audio Unit,
# universal (Apple Silicon and Intel), macOS 10.15 or later.
#
# Built here because it cannot be built on the development machine: the macOS
# SDK may only be used on Apple hardware, and GitHub's macOS runners are that
# hardware. The bundles are signed ad hoc, not notarized; INSTALL.txt in the
# archive explains the one command that clears the quarantine.
#
# Three jobs:
#   prepare  finds the plugins the way release.sh does (every folder with a
#            CMakeLists.txt but shared/), so a new plugin joins by existing,
#            and builds the static universal Cairo once if the cache has none.
#   build    one job per plugin: build, self-test on arm64 and under Rosetta,
#            sign, auval.
#   package  one suite archive, verdalis-suite-<version>-macos-universal.zip,
#            the macOS counterpart of release.sh's per-platform archives.
#
# Every run uploads the archive as a workflow artifact. When a GitHub release
# tagged v* is published (publish-release.sh), it is also attached to that
# release, beside the Linux and Windows archives.

name: macOS

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "_designs/**"
      - "**/docs/**"
      - "**/tools/analysis/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "_designs/**"
      - "**/docs/**"
      - "**/tools/analysis/**"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "10.15"

jobs:
  prepare:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-15
    outputs:
      plugins: ${{ steps.plugins.outputs.plugins }}
      cairo-key: ${{ steps.cairo.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v4

      - name: Plugins
        id: plugins
        run: |
          list=""
          for f in */CMakeLists.txt; do
            d="${f%/CMakeLists.txt}"
            [ "$d" = shared ] && continue
            grep -q '^project(' "$f" || continue
            list="${list:+$list,}\"$d\""
          done
          echo "plugins=[$list]" | tee -a "$GITHUB_OUTPUT"

      # Restored and saved in two steps, so a Cairo that was built is kept even
      # when a later step fails.
      - name: Cairo cache
        id: cairo
        uses: actions/cache/restore@v4
        with:
          path: |
            macbuild/cairo-macos/include
            macbuild/cairo-macos/lib
          key: cairo-macos-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('shared/cmake/build-macos-cairo.sh') }}
          lookup-only: true

      - name: Build tools
        if: steps.cairo.outputs.cache-hit != 'true'
        run: brew install meson ninja pkgconf

      - name: Cairo
        if: steps.cairo.outputs.cache-hit != 'true'
        run: shared/cmake/build-macos-cairo.sh macbuild/cairo-macos

      - name: Cairo cache save
        if: steps.cairo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            macbuild/cairo-macos/include
            macbuild/cairo-macos/lib
          key: ${{ steps.cairo.outputs.cache-primary-key }}

  build:
    needs: prepare
    runs-on: macos-15
    strategy:
      fail-fast: false
      # A job GitHub cannot find an arm64 runner for within 15 minutes is
      # cancelled ("not acquired by Runner of type hosted even after multiple
      # attempts"). That is GitHub's capacity, not this workflow: limiting the
      # jobs to five at a time did not prevent it. Re-run the cancelled ones
      # later with `gh run rerun <id> --failed`; the package job follows.
      matrix:
        plugin: ${{ fromJSON(needs.prepare.outputs.plugins) }}
    name: build (${{ matrix.plugin }})
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: brew install ninja

      # CLAP/ is gitignored (third-party SDKs, see CLAUDE.md): the versions the
      # Linux and Windows builds use, plus Apple's AudioUnitSDK, with the
      # patches from shared/patches/ applied.
      - name: SDKs
        run: |
          mkdir -p CLAP && cd CLAP
          git clone --depth 1 --branch 1.2.10 https://github.com/free-audio/clap.git
          git clone --depth 1 --branch v0.16.0 https://github.com/free-audio/clap-wrapper.git
          git clone --depth 1 --branch v3.8.1_build_84 https://github.com/steinbergmedia/vst3sdk.git
          git -C vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk
          git clone --depth 1 --branch AudioUnitSDK-1.1.0 https://github.com/apple/AudioUnitSDK.git
          for p in ../shared/patches/clap-wrapper-*.patch; do
            git -C clap-wrapper apply "../$p"
          done

      - name: Cairo
        uses: actions/cache/restore@v4
        with:
          path: |
            macbuild/cairo-macos/include
            macbuild/cairo-macos/lib
          key: ${{ needs.prepare.outputs.cairo-key }}
          fail-on-cache-miss: true

      - name: Identity
        id: id
        run: |
          p="${{ matrix.plugin }}"
          name="$(sed -n 's/^project(\([A-Za-z]*\) VERSION.*/\1/p' "$p/CMakeLists.txt")"
          [ -n "$name" ] || { echo "no project() name in $p/CMakeLists.txt"; exit 1; }
          echo "name=$name" | tee -a "$GITHUB_OUTPUT"
          echo "prefix=$(echo "$p" | tr '[:lower:]' '[:upper:]')" | tee -a "$GITHUB_OUTPUT"

      - name: Configure
        run: >
          cmake -S ${{ matrix.plugin }} -B ${{ matrix.plugin }}/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -D${{ steps.id.outputs.prefix }}_BUILD_TOOLS=ON
          -D${{ steps.id.outputs.prefix }}_BUILD_VST3=ON
          -D${{ steps.id.outputs.prefix }}_BUILD_AUV2=ON

      # -k 0: one run reports every compile error, not the first.
      - name: Build
        run: >
          cmake --build ${{ matrix.plugin }}/build
          --target ${{ steps.id.outputs.name }} ${{ steps.id.outputs.name }}-vst3
          ${{ steps.id.outputs.name }}-auv2 ${{ matrix.plugin }}-render
          -- -k 0

      # The wrapper decides where its bundles land on macOS, so they are looked
      # up rather than assumed. Each must be universal, and each must export
      # clap_entry: on macOS the VST3 and the Audio Unit find the plugin in
      # their own bundle through it, and without it they would look for a
      # .clap installed elsewhere -- the bug the Linux VST3 once shipped with.
      - name: Bundles
        id: bundles
        working-directory: ${{ matrix.plugin }}/build
        run: |
          name="${{ steps.id.outputs.name }}"
          for ext in clap vst3 component; do
            b="$(find . -maxdepth 3 -type d -name "${name}.${ext}" -not -path '*/CMakeFiles/*' | head -1)"
            [ -n "$b" ] || { echo "no ${name}.${ext} in the build tree"; exit 1; }
            echo "${ext}=$b" | tee -a "$GITHUB_OUTPUT"
            bin="$b/Contents/MacOS/${name}"
            lipo "$bin" -verify_arch arm64 x86_64
            lipo -info "$bin"
            nm -gU "$bin" | grep -q ' _clap_entry$' || { echo "$bin does not export clap_entry"; exit 1; }
            [ -d "$b/Contents/Resources/presets" ] || { echo "$b has no presets"; exit 1; }
          done

      # The renderer loads the built .clap as a host does and runs the plugin's
      # whole self-test through it. The x86_64 half runs under Rosetta.
      - name: Self-test
        working-directory: ${{ matrix.plugin }}/build
        run: |
          render="./${{ matrix.plugin }}-render"
          plugin="${{ steps.bundles.outputs.clap }}/Contents/MacOS/${{ steps.id.outputs.name }}"
          lipo -info "$render"
          echo "--- arm64"
          "$render" --plugin "$plugin" --selftest
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "--- x86_64 (Rosetta)"
            arch -x86_64 "$render" --plugin "$plugin" --selftest
          else
            echo "no Rosetta on this runner: x86_64 not run"
          fi

      - name: Sign (ad hoc)
        working-directory: ${{ matrix.plugin }}/build
        run: |
          for b in "${{ steps.bundles.outputs.clap }}" "${{ steps.bundles.outputs.vst3 }}" "${{ steps.bundles.outputs.component }}"; do
            codesign --force --deep --sign - "$b"
            codesign --verify --deep --strict --verbose=2 "$b"
          done

      # Loads the Audio Unit the way Logic does and runs Apple's validation:
      # instantiation, render at several rates, parameters, state.
      - name: Audio Unit validation
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "${{ matrix.plugin }}/build/${{ steps.bundles.outputs.component }}" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i "Rvtr" || true
          auval -v $(cat "${{ matrix.plugin }}/build/auv2-id.txt")

      # Tarred, because an artifact does not keep the executable bit.
      - name: Collect
        working-directory: ${{ matrix.plugin }}/build
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          for b in "${{ steps.bundles.outputs.clap }}" "${{ steps.bundles.outputs.vst3 }}" "${{ steps.bundles.outputs.component }}"; do
            cp -R "$b" "$RUNNER_TEMP/out/"
          done
          tar -C "$RUNNER_TEMP/out" -cf "$RUNNER_TEMP/${{ matrix.plugin }}.tar" .

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.plugin }}
          path: ${{ runner.temp }}/${{ matrix.plugin }}.tar
          retention-days: 7

  package:
    needs: [prepare, build]
    runs-on: macos-15
    permissions:
      contents: write # attaching the archive to a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          merge-multiple: true
          path: ${{ runner.temp }}/plugins

      - name: Package
        id: package
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            ver="${{ github.event.release.tag_name }}"
            ver="${ver#v}"
          else
            ver="dev-$(git rev-parse --short HEAD)"
          fi
          name="verdalis-suite-${ver}-macos-universal"
          d="dist/${name}"
          mkdir -p "$d/macos"
          for t in "$RUNNER_TEMP"/plugins/*.tar; do
            tar -C "$d/macos" -xf "$t"
          done

          cp README.md LICENSE "$d/"
          # A plugin whose licence differs from the suite's carries it beside
          # the suite's, exactly as release.sh does (SkyHowl's CC-BY credit).
          plugins=$(echo '${{ needs.prepare.outputs.plugins }}' | tr -d '[]"' | tr ',' ' ')
          info=""
          for p in $plugins; do
            n="$(sed -n 's/^project(\([A-Za-z]*\) VERSION \([0-9.]*\).*/\1/p' "$p/CMakeLists.txt")"
            v="$(sed -n 's/^project([A-Za-z]* VERSION \([0-9.]*\).*/\1/p' "$p/CMakeLists.txt")"
            info="${info}  ${n} ${v}"$'\n'
            if [ -f "$p/LICENSE" ] && ! cmp -s "$p/LICENSE" LICENSE; then
              cp "$p/LICENSE" "$d/LICENSE-${n}"
            fi
          done

          cat > "$d/BUILD-INFO.txt" <<EOF
          Verdalis suite ${ver} for macOS (universal: arm64 + x86_64, macOS 10.15 or later)

          Commit:       ${GITHUB_SHA}
          Built by:     GitHub Actions, ${{ github.workflow }} run ${{ github.run_id }}
          Formats:      CLAP, VST3, Audio Unit (v2)
          Signing:      ad hoc, not notarized
          SDKs:         clap 1.2.10, clap-wrapper v0.16.0 (patched, shared/patches),
                        VST3 SDK 3.8.1, AudioUnitSDK 1.1.0

          Plugins:
          ${info}
          EOF

          cat > "$d/INSTALL.txt" <<'EOF'
          Verdalis for macOS (10.15 or later, Apple Silicon and Intel)

          The macos/ folder holds every plugin in three formats. Install the
          format(s) your DAW uses:

            <Name>.clap       ->  ~/Library/Audio/Plug-Ins/CLAP/
            <Name>.vst3       ->  ~/Library/Audio/Plug-Ins/VST3/
            <Name>.component  ->  ~/Library/Audio/Plug-Ins/Components/

          (~/Library is hidden in the Finder: Go > Go to Folder... and type the path.)
          Logic Pro and GarageBand use the .component (Audio Unit).

          The plugins are free and not notarized by Apple, so macOS blocks
          files downloaded from the internet until their quarantine flag is
          cleared. After copying, open Terminal and run:

            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/CLAP
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components

          Without this the DAW does not load the plugins, or reports them as
          damaged. Then restart the DAW and let it rescan its plugins.

          The factory presets are built into every plugin. Your own presets
          live in ~/Library/Application Support/<Name>/presets.
          EOF

          ditto -c -k --keepParent "$d" "dist/${name}.zip"
          ls -l dist
          echo "zip=dist/${name}.zip" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.zip }}" --clobber
